<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
   <div id="mydiv">
        <h1>{{ message }}</h1>
    </div>
    
    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    message: "Welcome to After-School Lessons!"
                };
            }
        }).mount("#mydiv");
    </script>

</body>
</html>
