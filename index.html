
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After-School Lessons</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        header {
            background-color: #263b5e;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
        }

        main {
            padding: 20px;
        }

        .lessons-section {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div id="mydiv">

        <header>
            <h1>{{ message }}</h1>
            <p>Find and book your after-school lessons.</p>
        </header>

        <nav>
            <span>Lessons</span>
            |
            <span>Shopping Cart</span>
        </nav>

        <main>
            <section class="lessons-section">
    <h2>Available Lessons</h2>

    <div>
        <label>Sort by:</label>

        <select v-model="sortType">
            <option value="subject">Subject</option>
            <option value="location">Location</option>
            <option value="price">Price</option>
            <option value="available">Available Spaces</option>
        </select>

        <select v-model="isAscending">
            <option :value="true">Ascending</option>
            <option :value="false">Descending</option>
        </select>
    </div>
                <div v-for="lesson in lessons" :key="lesson.id">
                    <h3>Subject: {{ lesson.subject }}</h3>
                    <p>Location: {{ lesson.location }}</p>
                    <p>Price: Rs {{ lesson.price }}</p>
                    <p>Available slots: {{ lesson.available }}</p>

                    <img :src="lesson.imagePath"
                         style="width:200px;"
                         :alt="lesson.imageAlt">
                </div>

            </section>
        </main>

    </div>
